# Runs the automated tests on GitHub every time code is pushed.
name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # test on an older and a newer Python
    steps:
      - uses: actions/checkout@v4           # download the repository
      - uses: actions/setup-python@v5       # install Python
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest             # install the test runner
      - run: python -m pytest -v            # run every test
